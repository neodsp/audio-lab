[package]
description = "Measure impulse and frequency responses with sweeps and compare them, in GPUI"
edition = "2024"
license = "MIT"
name = "measurement-app"
publish = false
version = "0.1.0"

[dependencies]
audio-host = { version = "0.2.0", default-features = false, features = ["cpal"] }
audio-lab = { path = "../..", default-features = false, features = ["playback"] }
gpui-kit = "0.9"
num = "0.4"
