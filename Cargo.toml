[package]
authors = ["Stephan Eckes <stephan@neodsp.com>"]
categories = ["mathematics", "multimedia::audio", "science", "visualization"]
description = "Toolkit for audio research and testing"
edition = "2024"
homepage = "https://neodsp.com"
include = ["CHANGELOG.md", "LICENSE", "README.md", "examples/**", "src/**"]
keywords = ["audio", "dsp", "plot", "research", "signal-processing"]
license = "MIT"
name = "audio-lab"
repository = "https://github.com/neodsp/audio-lab"
rust-version = "1.95"
version = "0.1.0"

[dependencies]
approx = { version = "0.5", features = ["num-complex"] }
audio-blocks = "0.7.0"
ndarray = { version = "0.17", features = ["approx"] }
ndarray-rand = "0.16"
ndrustfft = "0.6"
num = "0.4"
realfft = "3.5"
rubato = "5.0.1"
thiserror = "2.0"

audio-file = { version = "0.5", default-features = false, features = [
  "all-codecs",
], optional = true }
audio-host = { version = "0.2.0", optional = true }
ndarray-npy = { version = "0.10", features = ["num-complex-0_4"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }

eframe = { version = "0.37", optional = true }
egui = { version = "0.37", optional = true }
egui_plot = { version = "0.38", optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
rfd = { version = "0.17", optional = true }
winit = { version = "0.30", features = ["wayland", "x11"], optional = true }

[features]
default = ["audio-file", "numpy", "playback", "plot"]

# read and write audio files
audio-file = ["dep:audio-file"]
# read and write NumPy `.npy` files
numpy = ["dep:ndarray-npy"]
# play signals on the default audio device
playback = ["dep:audio-host"]
# show signals, spectra and spectrograms in native windows
plot = ["dep:eframe", "dep:egui", "dep:egui_plot", "dep:image", "dep:rfd", "dep:winit"]
serde = ["dep:serde", "ndarray/serde", "num/serde"]

[[example]]
name = "fractional_octave_smoothing"
required-features = ["plot"]

[[example]]
name = "octave_filter_bank"
required-features = ["plot"]

[[example]]
name = "show_test_signals"
required-features = ["plot"]

[[example]]
name = "spectrogram"
required-features = ["plot"]

[package.metadata.docs.rs]
all-features = true
