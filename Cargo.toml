[workspace]
members = ["crates/audio-signal", "crates/audio-plot"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
audio-plot = { path = "crates/audio-plot" }
audio-signal = { path = "crates/audio-signal" }

approx = { version = "0.5", features = ["num-complex"] }
ndarray = { version = "0.17", features = ["approx"] }
ndrustfft = "0.6"
num = "0.4"
thiserror = "2.0"
serde = { version = "1", features = ["derive"] }
